# Single-node Garage S3 for the MES local/production-style stack.
# Mirrors the parameters of the reference deployment (~/Desktop/Projects/Docker/garagehq):
# ports 3900-3904, region `garage`, SQLite metadata, single-node replication.
#
# Secrets are intentionally absent here and supplied by Compose from docker/.env:
#   GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN
# (see the Garage configuration reference, "Environment variables").

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
# Advertise the compose service name so a future second node could reach it.
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"

[k2v_api]
api_bind_addr = "[::]:3904"

[admin]
api_bind_addr = "[::]:3903"

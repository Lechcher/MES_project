name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install
        working-directory: ./frontend

      - name: Install backend dependencies
        run: bun install
        working-directory: ./backend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-chromium-${{ hashFiles('frontend/package.json') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: Run E2E tests
        run: bun run test:e2e:ci
        working-directory: ./frontend
        env:
          CI: "true"
          NODE_ENV: "test"
          BETTER_AUTH_SECRET: "test-secret-do-not-use-in-production"
          BETTER_AUTH_URL: "http://localhost:3001"
          MES_DATABASE_PATH: "/tmp/mes-e2e.db"
          MES_API_PORT: "3001"
          MES_WEB_ORIGIN: "http://localhost:3000"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/e2e/playwright-report/
          retention-days: 7

      - name: upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: frontend/tests/e2e/junit.xml
          retention-days: 7